# Every push and PR: deterministic checks only (no LLM calls, no real infrastructure).
# LLM evals spend model quota, so they live in evals.yml and run on demand.
name: CI

on:
  push:
    branches: [main, qa]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest + case validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clinical cases match their spec and cover every grilla item
        run: python cases/validate.py
      - name: Unit and integration tests
        run: python -m pytest -q

  web:
    name: Web · lint, types, E2E (fake backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fake backend dependencies (FastAPI only, no LLM stack)
        run: pip install fastapi uvicorn
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: E2E (Playwright starts the fake API and a production build of the web app)
        run: |
          export AUTH_SECRET="$(openssl rand -base64 32)"
          npx playwright test
        env:
          CI: "true"
          E2E_PYTHON: python
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
